# DLE security rules, based on https://lazydev.pro/articles/77-nginx-security-for-dle.html
#
# Include inside the site's server {} block, ABOVE "location ~ \.php$" and the static-files
# location. nginx checks regex locations in the order they appear and uses the first match,
# so these rules have to come first to win:
#
#     include /etc/nginx/dle-security.conf;

# Hidden files and VCS folders: .git, .htaccess, .gitignore, .DS_Store, .env ...
# /.well-known/ stays open for Let's Encrypt (ACME) challenges.
location ~ /\.(?!well-known/) {
    return 404;
}

# Folders a browser never needs to open:
#   backup        DLE database dumps (users, e-mails, password hashes)
#   engine/cache  plugin-patched copies of engine files, cached data
#   engine/data   configs: config.php, dbconfig.php, xfields.json, ...
#   language      language packs (.lng files are PHP)
#   api           unused DevCraft DLE-API (2019, debug mode on); drop it from the list if you ever use it
location ~* ^/(backup|engine/cache|engine/data|language|api)(/|$) {
    return 404;
}

# No PHP execution where only uploads, templates and static assets live: a script that slips
# through the uploader (or arrives with a template) can't be run.
location ~* ^/(uploads|templates|public|pwa)/.*\.php$ {
    return 404;
}

# Template sources, SQL dumps, logs, editor and backup leftovers, anywhere on the site
location ~* \.(tpl|lng|sql|log|bak|old|orig|swp)$ {
    return 404;
}

# Don't advertise the PHP version (X-Powered-By: PHP/8.5.x)
fastcgi_hide_header X-Powered-By;

# Browsers must not guess content types (an uploaded file can't be sniffed into HTML/JS).
# DLE itself already sends X-Frame-Options: SAMEORIGIN.
add_header X-Content-Type-Options "nosniff" always;
