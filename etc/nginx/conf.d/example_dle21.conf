# Ready-to-use nginx site config for DataLife Engine 21 in this Docker stack.
#
#   1. cp etc/nginx/conf.d/example_dle21.conf etc/nginx/conf.d/<your-site>.conf
#   2. set server_name (and enable the HTTPS lines if this container terminates SSL)
#   3. docker exec nginx nginx -t && docker exec nginx nginx -s reload
#
# This file is loaded as-is too (nginx.conf includes conf.d/*.conf), but it only answers
# example.com: requests by IP or for unknown hosts are dropped by the default server in nginx.conf.
# Don't add default_server here.
#
# Cache settings go to the http level, for example:
#     proxy_cache_path /var/cache/nginx levels=2 keys_zone=cache:10m inactive=60m max_size=1024m;
#     proxy_cache_key "$host$request_uri $cookie_user";
#     proxy_temp_path  /var/cache/nginx/temp;
#     proxy_ignore_headers Expires Cache-Control;
#     proxy_cache_use_stale error timeout invalid_header http_502;
#     proxy_cache_valid any 1d;

server {
    listen 80;
    # HTTPS in this container (certificate files in etc/nginx/, mounted to /etc/nginx/):
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/cert.pem;
    # ssl_certificate_key /etc/nginx/key.pem;

    server_name example.com www.example.com;

    error_log  /var/log/nginx/example.com.error.log error;
    access_log /var/log/nginx/example.com.access.log main;

    # docker-compose can publish nginx on another port (HTTP_PORT): keep redirects relative,
    # otherwise nginx would send visitors to port 80
    absolute_redirect off;

    root /var/www/html;
    index index.php;

    # Security rules (etc/nginx/dle-security.conf): must stay ABOVE the PHP and static-file locations
    include /etc/nginx/dle-security.conf;

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # only scripts that really exist (stops /uploads/photo.jpg/x.php tricks)
        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }
        # php-fpm socket shared with the app container (phpsock volume, etc/php/www.conf)
        fastcgi_pass unix:/tmp/php/php7-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors on;
    }

    # Static files are served by nginx directly
    location ~* \.(?:css|js|map)$ {
        try_files $uri =404;
    }

    location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|pdf|zip|rar)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Sitemaps are generated by DLE into /uploads/
    rewrite "^/sitemap.xml$"          /uploads/sitemap.xml last;
    rewrite "^/google_news.xml$"      /uploads/google_news.xml last;
    rewrite "^/static_pages.xml$"     /uploads/static_pages.xml last;
    rewrite "^/category_pages.xml$"   /uploads/category_pages.xml last;
    rewrite "^/tags_pages.xml$"       /uploads/tags_pages.xml last;
    rewrite "^/news_pages(\d*?).xml$" /uploads/news_pages$1.xml last;

    # DLE 21 resolves friendly URLs itself (engine/data/rules.json, admin panel: ЧПУ settings),
    # so every request that isn't an existing file goes to index.php with the original URI.
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
}
